services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: igate-app:latest
    container_name: ${APP_NAME:-igate}_app
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-igate}
      DB_USERNAME: ${DB_USERNAME:-igate}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@igate.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-${APP_NAME:-iGate}}
    volumes:
      - storage-files:/var/www/storage
      - public-files:/var/www/public_shared
    networks:
      - igate_network
      - dokploy-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  worker:
    image: igate-app:latest
    container_name: ${APP_NAME:-igate}_worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-igate}
      DB_USERNAME: ${DB_USERNAME:-igate}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      QUEUE_CONNECTION: database
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@igate.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-${APP_NAME:-iGate}}
    volumes:
      - storage-files:/var/www/storage
    networks:
      - igate_network
      - dokploy-network
    depends_on:
      app:
        condition: service_started

  web:
    image: nginx:alpine
    container_name: ${APP_NAME:-igate}_web
    restart: always
    ports:
      - "${WEB_PORT:-8001}:80"
    volumes:
      - public-files:/var/www/public:ro
      - storage-files:/var/www/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
    networks:
      - igate_network
      - dokploy-network

  db:
    image: mysql:8.0
    container_name: ${APP_NAME:-igate}_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-igate}
      MYSQL_USER: ${DB_USERNAME:-igate}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - igate_db_data:/var/lib/mysql
    networks:
      - igate_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  igate_network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  igate_db_data:
    driver: local
  public-files:
    driver: local
  storage-files:
    driver: local
